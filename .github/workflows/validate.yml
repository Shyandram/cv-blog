name: Validate

# Runs the checks from AGENTS.md section 6 on every pull request and on pushes to main.
# Deployment is separate: Cloudflare builds and publishes main on its own.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: MDX syntax, KaTeX and frontmatter
        run: find src/content \( -name '*.md' -o -name '*.mdx' \) ! -name '_*' -print0 | xargs -0 node scripts/check-mdx.mjs
      - name: Content map is up to date
        run: node scripts/content-index.mjs --check
      - name: Playground coverage and unit tests
        run: |
          node --experimental-strip-types scripts/check-content-stats.mjs
          node scripts/check-playground.mjs
          node --experimental-strip-types --test scripts/tests/*.test.ts
      - name: Type and template check
        run: npx astro check
      - name: Build and search index
        run: npm run build
